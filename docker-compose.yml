services:
  orich:
    build: .
    ports:
      - "8788:8788"
    environment:
      - PORT=8788
      # Production hardening (optional):
      # - ORICH_HIDE_OTP=1
      # - ADMIN_USER=admin
      # - ADMIN_PASS=change-me
    volumes:
      - orich-data:/app/server/data   # persist runtime state (users, orders, settings)
    restart: unless-stopped

volumes:
  orich-data:
