name = "orich"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Built static assets (user app at /, admin at /admin) served by the same Worker.
# Run `npm run build` first to populate ./public.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Persistent state lives in one KV document. Create the namespace and paste its id:
#   npx wrangler kv namespace create ORICH_KV
[[kv_namespaces]]
binding = "ORICH_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Production hardening (uncomment / set with: npx wrangler secret put ...):
# [vars]
# ORICH_HIDE_OTP = "1"
